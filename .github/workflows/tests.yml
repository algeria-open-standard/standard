name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        working-directory: impl/js
        run: pnpm install --frozen-lockfile
      - name: Tests
        working-directory: impl/js
        run: pnpm test
      - name: The examples rebuild to the same bytes
        run: |
          node formats/hr/examples/build.mjs
          git diff --exit-code -- formats
